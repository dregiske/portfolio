<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon_io/favicon-32x32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon_io/favicon-16x16.png?v=2"
    />
    <link rel="apple-touch-icon" href="/favicon_io/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/favicon_io/site.webmanifest?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Andre Giske - Portfolio</title>
    <meta
      name="description"
      content="Andre Giske — CSE student at UCSD passionate about backend systems and full-stack deployment. Check out my projects, skills, and get in touch."
    />

    <!-- Open Graph (LinkedIn, iMessage, Slack previews) -->
    <meta property="og:title" content="Andre Giske - Portfolio" />
    <meta
      property="og:description"
      content="CSE student at UCSD. Check out my projects, skills, and get in touch."
    />
    <meta property="og:url" content="https://andregiske.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://andregiske.com/profile.jpg" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Andre Giske - Portfolio" />
    <meta name="twitter:description" content="CSE student at UCSD." />
    <meta name="twitter:image" content="https://andregiske.com/profile.jpg" />

    <!-- The hero wordmark is the largest thing on first paint; fetch its face
         up front so it doesn't land as a visible swap. -->
    <link
      rel="preload"
      href="/fonts/Poppins-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Dark-only while the theme toggle is archived. Unconditional on purpose:
         a visitor who once chose light still has `theme=light` stored, and with
         no toggle on the page they'd have no way back. To restore the toggle,
         put back the `localStorage.getItem("theme") !== "light"` check. -->
    <script>
      document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The build prerenders the home page into #root. Every other path (nginx
         falls back to this file) is the 404, so drop that markup before it can
         paint; main.tsx then renders the right page. Mirrors isHomePath. -->
    <script>
      if (!/^\/(index\.html)?$/.test(location.pathname)) {
        document.getElementById("root").replaceChildren();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
